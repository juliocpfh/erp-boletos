{% extends 'base.html' %}{% from '_macros.html' import tabela_historico with context %}
{% block titulo %}Histórico{% endblock %}
{% block conteudo %}
<h1>Histórico de alterações</h1>
<form class="cartao formulario" method="get">
  <div><label>Usuário</label><select name="usuario"><option value=""></option>{% for u in usuarios %}<option {{ 'selected' if request.args.usuario == u }}>{{ u }}</option>{% endfor %}</select></div>
  <div><label>Tipo de registro</label><select name="tabela"><option value=""></option>{% for k, v in tabelas.items() %}<option value="{{ k }}" {{ 'selected' if request.args.tabela == k }}>{{ v }}</option>{% endfor %}</select></div>
  <div><label>De</label><input type="date" name="de" value="{{ request.args.de or '' }}"></div>
  <div><label>Até</label><input type="date" name="ate" value="{{ request.args.ate or '' }}"></div>
  <div><label>Contém o texto</label><input type="text" name="texto" value="{{ request.args.texto or '' }}"></div>
  <div class="check"><button>Filtrar</button><a href="{{ url_for('views.historico_tela') }}">Limpar</a></div>
</form>
<div class="cartao">{{ tabela_historico(historico) }}<p class="suave">Mostrando até 500 registros mais recentes.</p></div>
{% endblock %}
