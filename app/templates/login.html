{% extends 'base.html' %}{% from '_macros.html' import csrf_input with context %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="cartao login">
  <h1>Administração de Imóveis</h1>
  <form method="post">
    {{ csrf_input() }}
    <p><label>Login</label><input type="text" name="login" autofocus autocomplete="username"></p>
    <p><label>Senha</label><input type="password" name="senha" autocomplete="current-password"></p>
    <button>Entrar</button>
  </form>
</div>
{% endblock %}
