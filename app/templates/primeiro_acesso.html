{% extends 'base.html' %}{% from '_macros.html' import csrf_input with context %}
{% block titulo %}Primeiro acesso{% endblock %}
{% block conteudo %}
<div class="cartao login">
  <h1>Primeiro acesso</h1>
  <p class="suave">Crie o usuário administrador. Depois ele pode cadastrar os demais usuários.</p>
  <form method="post">
    {{ csrf_input() }}
    <p><label>Seu nome</label><input type="text" name="nome" autofocus></p>
    <p><label>Login</label><input type="text" name="login" autocomplete="username"></p>
    <p><label>Senha (mínimo 6 caracteres)</label><input type="password" name="senha" autocomplete="new-password"></p>
    <p><label>Repita a senha</label><input type="password" name="senha2" autocomplete="new-password"></p>
    <button>Criar administrador</button>
  </form>
</div>
{% endblock %}
