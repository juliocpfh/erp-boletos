# Configuração do Worker (dados na nuvem). Publicar: na pasta nuvem/, `npx wrangler deploy` (passo a passo em README.md).
# Os e-mails e os dados do Access NÃO ficam aqui: são cadastrados no painel do Cloudflare (Settings → Variables).
# O comando de build do Workers Builds (roda os testes antes de publicar) também fica no painel: veja "Testes antes de publicar" no README.md.
name = "erp-boletos"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = false

# Mesmo endereço do site: o navegador chama /api/ sem sair de erp.ankjck.com.br (sem CORS)
# A ficha cadastral pela internet (ficha-publica.mjs) tem endereço próprio, fora do login do Access: o Cloudflare cria o
# DNS e o cadeado de ficha.ankjck.com.br sozinho (custom_domain). O sistema (erp.ankjck.com.br) continua fechado.
routes = [
  { pattern = "erp.ankjck.com.br/api/*", zone_name = "ankjck.com.br" },
  { pattern = "ficha.ankjck.com.br", custom_domain = true },
  # Painel de vendas das licenças (painel-vendas.mjs): atrás de um aplicativo próprio do Access (ACCESS_AUD_VENDAS)
  { pattern = "vendas.ankjck.com.br", custom_domain = true },
]

[[r2_buckets]]
binding = "DADOS"
bucket_name = "imoveis-dados"

[vars]
ORIGEM = "https://erp.ankjck.com.br"
HOST_FICHA = "ficha.ankjck.com.br"
URL_FICHA = "https://ficha.ankjck.com.br/"
HOST_VENDAS = "vendas.ankjck.com.br"
# Painel de vendas: ACCESS_AUD_VENDAS, GERENTES_VENDAS e LICENCA_CHAVE_PRIVADA (segredo) no painel
# ACCESS_EQUIPE (ex.: ankjck.cloudflareaccess.com), ACCESS_AUD e EMAILS: no painel

# Cofre dos dados (cofre.mjs): um Durable Object com SQLite, grátis até 5 GB
[[durable_objects.bindings]]
name = "COFRE"
class_name = "CofreDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CofreDO"]

# Cofre das licenças (cofre-licencas.mjs): separado dos dados dos clientes
[[durable_objects.bindings]]
name = "LICENCAS"
class_name = "CofreLicencasDO"

[[migrations]]
tag = "v2-licencas"
new_sqlite_classes = ["CofreLicencasDO"]
